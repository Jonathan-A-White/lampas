<text x="16" y="30" class="title">Link pictures: the first thought white, the second amber, the link blue (npm run pictures:sheet)</text>
<svg x="40" y="48" width="80" height="80" viewBox="0 0 96 96"><rect width="96" height="96" rx="16" fill="#16203a"/><rect x='12' y='16' width='58' height='16' rx='8' fill='#e7ebf3'/><rect x='12' y='64' width='58' height='16' rx='8' fill='#f2b544'/><path d='M72 72H76Q86 72 86 62V34Q86 24 76 24H74M81 17 74 24 81 31' fill='none' stroke='#7fb2e5' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>
